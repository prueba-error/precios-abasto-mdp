[project]
name = "scraping-verduras"
version = "0.1.0"
description = "System for tracking wholesale prices from Abasto Central MDP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "supabase>=1.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
